name: Desktop App Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_flag: --win
            artifact_pattern: apps/desktop/dist-release/*.exe, apps/desktop/dist-release/*.zip
          - os: macos-latest
            target_flag: --mac
            artifact_pattern: apps/desktop/dist-release/*.dmg, apps/desktop/dist-release/*.zip
          - os: ubuntu-latest
            target_flag: --linux
            artifact_pattern: apps/desktop/dist-release/*.AppImage, apps/desktop/dist-release/*.deb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        continue-on-error: true

      - name: Build desktop shell
        run: |
          cd apps/desktop
          pnpm run build

      - name: Package desktop application
        run: |
          cd apps/desktop
          npx electron-builder --config electron-builder.dist.json ${{ matrix.target_flag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ matrix.artifact_pattern }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
